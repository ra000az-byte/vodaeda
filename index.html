<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вода и еда</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вода и еда">
<meta name="theme-color" content="#0e2a3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f3f7f8;--card:#fff;--tx:#12262f;--mut:#5f7782;--ac:#0a8fb8;--ac2:#e8590c;--ln:#d8e3e7;--ok:#2b9348;--er:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1c26;--card:#12303f;--tx:#e8f2f5;--mut:#8fb0bd;--ac:#4cc9f0;--ac2:#ff9f5a;--ln:#24465a;--ok:#5fd07c;--er:#ff7b7b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 14px}
h2{font-size:17px;margin:20px 0 8px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:0;border-radius:14px;padding:14px;background:var(--ac);color:#04212c;font-weight:600;min-height:52px;width:100%}
button.sec{background:transparent;border:1px solid var(--ln);color:var(--tx)}
button.sm{min-height:36px;padding:6px 12px;width:auto;border-radius:10px}
button:active{opacity:.7}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:44px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.ring{position:relative;width:200px;height:200px;margin:4px auto 12px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:34px}.mut{color:var(--mut);font-size:14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.food i{background:var(--ac2)}
.it{border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}
.g5{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g5 label{margin:6px 0 2px;font-size:12px}
.msg{padding:10px;border-radius:10px;margin:10px 0;font-size:15px}
.msg.er{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}
.msg.in{background:color-mix(in srgb,var(--ac) 15%,transparent)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{background:transparent;color:var(--mut);min-height:52px;padding:6px;font-size:13px;border-radius:12px}
nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
nav span{display:block;font-size:22px}
</style>
</head>
<body>
<main>

<section class="tab on" id="t-water">
  <h1>Вода</h1>
  <div class="card">
    <div class="ring">
      <svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="82" fill="none" stroke="var(--ln)" stroke-width="16"/><circle id="ringp" cx="100" cy="100" r="82" fill="none" stroke="var(--ac)" stroke-width="16" stroke-linecap="round" stroke-dasharray="515.2" stroke-dashoffset="515.2" style="transition:stroke-dashoffset .4s"/></svg>
      <div class="c"><b id="wml">0</b><span class="mut" id="wgoal">из 2000 мл</span></div>
    </div>
    <div class="row"><button data-w="200">+200</button><button data-w="250">+250</button><button data-w="500">+500</button></div>
    <div class="row" style="margin-top:8px"><input id="wcustom" type="number" inputmode="numeric" placeholder="Свой объём, мл"><button class="sec" id="wadd" style="flex:0 0 120px">Добавить</button></div>
    <button class="sec" id="wundo" style="margin-top:8px">Отменить последнюю запись</button>
  </div>
  <h2>Последние 14 дней</h2>
  <div class="card" id="whist"></div>
</section>

<section class="tab" id="t-food">
  <h1>Еда</h1>
  <div class="card">
    <div class="row"><b id="kc">0</b><span class="mut" style="text-align:right" id="kcg"></span></div>
    <div class="bar food"><i id="kbar" style="width:0"></i></div>
    <div class="mut" id="macro" style="margin-top:6px"></div>
  </div>
  <div class="row">
    <button id="bcam">📷 Снять еду</button>
    <button class="sec" id="bgal">🖼 Из галереи</button>
  </div>
  <input type="file" id="fcam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fgal" accept="image/*" hidden>
  <div id="status"></div>
  <div id="result"></div>
  <h2>Дневник за сегодня</h2>
  <div class="card" id="diary"></div>
</section>

<section class="tab" id="t-weight">
  <h1>Вес</h1>
  <div class="card">
    <div class="row" style="align-items:end">
      <div><div class="mut">Сейчас</div><b id="kgcur" style="font-size:32px"></b></div>
      <div style="text-align:right"><div class="mut">Цель</div><b id="kggoal" style="font-size:22px"></b></div>
    </div>
    <div class="bar"><i id="kgbar" style="width:0"></i></div>
    <div class="row mut" style="margin-top:6px"><span id="kgstart"></span><span id="kgleft" style="text-align:right"></span></div>
  </div>
  <div class="card" id="kgchart"></div>
  <div class="card">
    <div class="row">
      <div><label for="kgin" style="margin-top:0">Вес, кг</label><input id="kgin" type="text" inputmode="decimal" placeholder="например 91,4"></div>
      <div><label for="kgdate" style="margin-top:0">Дата</label><input id="kgdate" type="date"></div>
    </div>
    <button id="kgadd" style="margin-top:12px">Записать вес</button>
  </div>
  <h2>История</h2>
  <div class="card" id="kgtable"></div>
</section>

<section class="tab" id="t-set">
  <h1>Настройки</h1>
  <div class="card">
    <label for="skey">Ключ OpenAI API (хранится только на этом телефоне)</label>
    <input id="skey" type="password" placeholder="sk-..." autocomplete="off" autocapitalize="off">
    <label for="smodel">Модель</label>
    <input id="smodel" placeholder="gpt-4o-mini" autocapitalize="off">
    <label for="sgw">Норма воды, мл</label>
    <input id="sgw" type="number" inputmode="numeric">
    <label for="sgk">Цель по калориям, ккал</label>
    <input id="sgk" type="number" inputmode="numeric">
    <label for="skgs">Стартовый вес, кг</label>
    <input id="skgs" type="text" inputmode="decimal">
    <label for="skgg">Целевой вес, кг</label>
    <input id="skgg" type="text" inputmode="decimal">
    <button id="ssave" style="margin-top:14px">Сохранить</button>
  </div>
  <h2>Резервная копия</h2>
  <div class="card">
    <div class="mut">Экспорт копирует все данные в поле ниже. Для импорта вставьте туда сохранённый текст.</div>
    <textarea id="bk" rows="4" style="margin:8px 0"></textarea>
    <div class="row"><button class="sec" id="bexp">Экспорт</button><button class="sec" id="bimp">Импорт</button></div>
  </div>
</section>

</main>
<nav>
  <button class="on" data-tab="water"><span>💧</span>Вода</button>
  <button data-tab="food"><span>🍽</span>Еда</button>
  <button data-tab="weight"><span>⚖️</span>Вес</button>
  <button data-tab="set"><span>⚙️</span>Настройки</button>
</nav>

<script>
// ---------- Хранилище ----------
const KEY='vodaeda.v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const def={water:{},food:{},weight:[],set:{key:'',model:'gpt-4o-mini',goalMl:2000,goalKcal:2000,wStart:92,wGoal:82}};
let D;
try{D=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'));D.set=Object.assign({},def.set,D.set)}catch(e){D=JSON.parse(JSON.stringify(def))}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const day=(d=new Date())=>d.toLocaleDateString('sv');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Math.max(0,Math.round(parseFloat(v)||0));

// ---------- Вкладки ----------
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.tab));
  window.scrollTo(0,0);
});

// ---------- Вода ----------
function renderWater(){
  const list=D.water[day()]||[], sum=list.reduce((a,x)=>a+x.ml,0), goal=D.set.goalMl;
  $('#wml').textContent=sum;
  $('#wgoal').textContent='из '+goal+' мл';
  $('#ringp').style.strokeDashoffset=515.2*(1-Math.min(1,sum/goal));
  let h='';
  for(let i=0;i<14;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const s=(D.water[day(d)]||[]).reduce((a,x)=>a+x.ml,0);
    h+=`<div class="li" style="display:block"><div class="row" style="justify-content:space-between"><span>${i?d.toLocaleDateString('ru',{day:'numeric',month:'short',weekday:'short'}):'Сегодня'}</span><b>${s} мл</b></div><div class="bar"><i style="width:${Math.min(100,s/goal*100)}%"></i></div></div>`;
  }
  $('#whist').innerHTML=h;
}
function addWater(ml){
  ml=num(ml);if(!ml)return;
  (D.water[day()]??=[]).push({t:Date.now(),ml});save();renderWater();
  if(navigator.vibrate)navigator.vibrate(20);
}
$$('[data-w]').forEach(b=>b.onclick=()=>addWater(b.dataset.w));
$('#wadd').onclick=()=>{addWater($('#wcustom').value);$('#wcustom').value=''};
$('#wundo').onclick=()=>{(D.water[day()]||[]).pop();save();renderWater()};

// ---------- Дневник еды ----------
const MEALS=['Завтрак','Обед','Ужин','Перекус'];
function defMeal(){const h=new Date().getHours();return h<11?0:h<16?1:h<21?2:3}
function renderFood(){
  const list=D.food[day()]||[];
  const t=list.reduce((a,x)=>({k:a.k+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c}),{k:0,p:0,f:0,c:0});
  const goal=D.set.goalKcal, left=goal-t.k;
  $('#kc').textContent=t.k+' ккал';
  $('#kcg').textContent=(left>=0?'осталось ':'превышение ')+Math.abs(left)+' из '+goal;
  $('#kbar').style.width=Math.min(100,t.k/goal*100)+'%';
  $('#macro').textContent=`Б ${t.p} г · Ж ${t.f} г · У ${t.c} г`;
  $('#diary').innerHTML=list.length?list.map((x,i)=>`<div class="li"><div><b>${esc(x.name)}</b><div class="mut">${MEALS[x.meal]} · ${x.g} г · Б${x.p} Ж${x.f} У${x.c}</div></div><div style="text-align:right"><b>${x.kcal}</b><br><button class="sec sm" data-del="${i}">Удалить</button></div></div>`).join(''):'<div class="mut">Пока пусто. Снимите тарелку или перекус.</div>';
  $$('[data-del]').forEach(b=>b.onclick=()=>{D.food[day()].splice(+b.dataset.del,1);save();renderFood()});
}

// ---------- Сканер еды ----------
const setStatus=(m,c='in')=>{$('#status').innerHTML=m?`<div class="msg ${c}">${esc(m)}</div>`:''};
$('#bcam').onclick=()=>$('#fcam').click();
$('#bgal').onclick=()=>$('#fgal').click();
$('#fcam').onchange=$('#fgal').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)scan(f)};

// Сжатие фото до 1024 px по длинной стороне
function shrink(file){
  return new Promise((ok,fail)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,1024/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.8));
    };
    img.onerror=()=>fail(new Error('Не удалось открыть фото'));
    img.src=url;
  });
}

const PROMPT=`Ты нутрициолог. Определи еду на фото и оцени порцию. Ответь СТРОГО JSON без пояснений:
{"items":[{"name":"название по-русски","grams":число,"kcal":число,"protein":число,"fat":число,"carbs":число}],"confidence":"низкая|средняя|высокая","note":"короткий комментарий или пустая строка"}
Каждое блюдо или продукт отдельной позицией. Значения kcal, protein, fat, carbs — для всей указанной порции (не на 100 г). Если еды на фото нет, верни пустой items.`;

async function scan(file){
  $('#result').innerHTML='';
  if(!D.set.key){setStatus('Сначала добавьте ключ OpenAI во вкладке «Настройки».','er');return}
  if(!navigator.onLine){setStatus('Нет интернета. Для распознавания он нужен.','er');return}
  try{
    setStatus('Сжимаю фото…');
    const img=await shrink(file);
    setStatus('Распознаю еду…');
    const r=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+D.set.key.trim()},
      body:JSON.stringify({model:D.set.model||'gpt-4o-mini',response_format:{type:'json_object'},
        messages:[{role:'user',content:[{type:'text',text:PROMPT},{type:'image_url',image_url:{url:img,detail:'low'}}]}]})
    });
    if(r.status===401){setStatus('Неверный ключ OpenAI. Проверьте его в настройках.','er');return}
    if(r.status===429){setStatus('Лимит или нет средств на счёте OpenAI API. Проверьте баланс на platform.openai.com.','er');return}
    if(!r.ok){const t=await r.json().catch(()=>({}));setStatus('Ошибка OpenAI: '+(t.error?.message||r.status),'er');return}
    const j=await r.json();
    const p=JSON.parse(j.choices[0].message.content);
    if(!p.items||!p.items.length){setStatus('Еда на фото не найдена. Попробуйте снять ближе и при хорошем свете.','er');return}
    setStatus('');showResult(p);
  }catch(e){setStatus('Не удалось распознать: '+e.message,'er')}
}

function showResult(p){
  const items=p.items.map(x=>({name:x.name,g:num(x.grams),kcal:num(x.kcal),p:num(x.protein),f:num(x.fat),c:num(x.carbs)}));
  const box=$('#result');
  box.innerHTML=`<div class="card"><b>Результат</b> <span class="mut">· уверенность: ${esc(p.confidence||'—')}</span>${p.note?`<div class="mut">${esc(p.note)}</div>`:''}
  <div style="margin-top:10px">${items.map((x,i)=>`<div class="it" data-i="${i}">
    <input data-k="name" value="${esc(x.name)}">
    <div class="g5">
      <div><label>Вес, г</label><input data-k="g" type="number" inputmode="numeric" value="${x.g}"></div>
      <div><label>Ккал</label><input data-k="kcal" type="number" inputmode="numeric" value="${x.kcal}"></div>
      <div><label>Белки</label><input data-k="p" type="number" inputmode="numeric" value="${x.p}"></div>
      <div><label>Жиры</label><input data-k="f" type="number" inputmode="numeric" value="${x.f}"></div>
    </div>
    <div class="row" style="margin-top:6px;align-items:end"><div><label>Углеводы</label><input data-k="c" type="number" inputmode="numeric" value="${x.c}"></div><button class="sec sm" data-rm style="flex:0 0 auto">Убрать</button></div>
  </div>`).join('')}</div>
  <label for="meal">Приём пищи</label>
  <select id="meal">${MEALS.map((m,i)=>`<option value="${i}" ${i===defMeal()?'selected':''}>${m}</option>`).join('')}</select>
  <div class="row" style="margin-top:12px"><button id="rsave">Добавить в дневник</button><button class="sec" id="rcancel" style="flex:0 0 110px">Отмена</button></div></div>`;
  $$('[data-rm]').forEach(b=>b.onclick=()=>b.closest('.it').remove());
  $('#rcancel').onclick=()=>box.innerHTML='';
  $('#rsave').onclick=()=>{
    const meal=+$('#meal').value;
    $$('.it').forEach(el=>{
      const v=k=>el.querySelector(`[data-k=${k}]`).value;
      (D.food[day()]??=[]).push({t:Date.now(),meal,name:v('name').trim()||'Блюдо',g:num(v('g')),kcal:num(v('kcal')),p:num(v('p')),f:num(v('f')),c:num(v('c'))});
    });
    save();box.innerHTML='';renderFood();
  };
  box.scrollIntoView({behavior:'smooth'});
}

// ---------- Вес ----------
const dec=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const dlabel=d=>new Date(d+'T00:00:00').toLocaleDateString('ru',{day:'numeric',month:'short',year:'2-digit'});

// График: линия веса и пунктир цели
function kgChart(W,g){
  if(W.length<2)return '<div class="mut">График появится после двух записей веса.</div>';
  const w=320,h=150,p=22;
  const ts=W.map(x=>+new Date(x.d+'T00:00:00')),t0=ts[0],t1=ts[ts.length-1];
  const ks=W.map(x=>x.kg).concat(g),lo=Math.min(...ks)-1,hi=Math.max(...ks)+1;
  const X=t=>(p+(t-t0)/((t1-t0)||1)*(w-2*p)).toFixed(1),Y=k=>(h-p-(k-lo)/(hi-lo)*(h-2*p)).toFixed(1);
  const pts=W.map((x,i)=>X(ts[i])+','+Y(x.kg)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%"><line x1="${p}" x2="${w-p}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="${w-p}" y="${Y(g)-5}" text-anchor="end" font-size="11" fill="var(--ok)">цель ${fmt(g)}</text><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${W.map((x,i)=>`<circle cx="${X(ts[i])}" cy="${Y(x.kg)}" r="3.5" fill="var(--ac)"/>`).join('')}</svg>`;
}

function renderWeight(){
  const W=[...D.weight].sort((a,b)=>a.d.localeCompare(b.d));
  const s=D.set.wStart,g=D.set.wGoal,cur=W.length?W[W.length-1].kg:s;
  const reached=g<s?cur<=g:cur>=g;
  const pct=s===g?100:Math.max(0,Math.min(100,(cur-s)/(g-s)*100));
  $('#kgcur').textContent=fmt(cur)+' кг';
  $('#kggoal').textContent=fmt(g)+' кг';
  $('#kgbar').style.width=pct+'%';
  $('#kgstart').textContent='старт '+fmt(s)+' кг';
  $('#kgleft').textContent=reached?'цель достигнута 🎉':'осталось '+fmt(Math.abs(cur-g))+' кг';
  $('#kgchart').innerHTML=kgChart(W,g);
  // Таблица: новые записи сверху, изменение относительно предыдущей записи
  const rows=W.map((x,i)=>{
    const prev=i?W[i-1].kg:s,dl=Math.round((x.kg-prev)*10)/10;
    const good=g<s?dl<0:dl>0;
    const dtxt=dl===0?'0':(dl>0?'+':'−')+fmt(Math.abs(dl));
    return `<div class="li"><div><b>${fmt(x.kg)} кг</b><div class="mut">${dlabel(x.d)}</div></div><div style="text-align:right"><span style="color:${dl===0?'var(--mut)':good?'var(--ok)':'var(--er)'};font-weight:600">${dtxt}</span><br><button class="sec sm" data-kgdel="${x.d}">Удалить</button></div></div>`;
  }).reverse().join('');
  $('#kgtable').innerHTML=rows||'<div class="mut">Пока нет записей. Встаньте на весы и запишите вес.</div>';
  $$('[data-kgdel]').forEach(b=>b.onclick=()=>{D.weight=D.weight.filter(x=>x.d!==b.dataset.kgdel);save();renderWeight()});
}
$('#kgdate').value=day();
$('#kgadd').onclick=()=>{
  const kg=Math.round(dec($('#kgin').value)*10)/10,d=$('#kgdate').value||day();
  if(kg<20||kg>400){$('#kgin').focus();return}
  D.weight=D.weight.filter(x=>x.d!==d);D.weight.push({d,kg}); // одна запись на дату
  save();$('#kgin').value='';renderWeight();
};

// ---------- Настройки ----------
function loadSet(){$('#skey').value=D.set.key;$('#smodel').value=D.set.model;$('#sgw').value=D.set.goalMl;$('#sgk').value=D.set.goalKcal;$('#skgs').value=fmt(D.set.wStart);$('#skgg').value=fmt(D.set.wGoal)}
$('#ssave').onclick=()=>{
  D.set.key=$('#skey').value.trim();D.set.model=$('#smodel').value.trim()||'gpt-4o-mini';
  D.set.goalMl=num($('#sgw').value)||2000;D.set.goalKcal=num($('#sgk').value)||2000;D.set.wStart=dec($('#skgs').value)||92;D.set.wGoal=dec($('#skgg').value)||82;
  save();renderWater();renderFood();renderWeight();$('#ssave').textContent='Сохранено ✓';setTimeout(()=>$('#ssave').textContent='Сохранить',1500);
};
$('#bexp').onclick=async()=>{
  const c={...D,set:{...D.set,key:''}}; // ключ в резервную копию не попадает
  $('#bk').value=JSON.stringify(c);
  try{await navigator.clipboard.writeText($('#bk').value);$('#bexp').textContent='Скопировано ✓'}catch(e){$('#bk').select()}
  setTimeout(()=>$('#bexp').textContent='Экспорт',1500);
};
$('#bimp').onclick=()=>{
  try{
    const x=JSON.parse($('#bk').value);if(!x.water||!x.food)throw 0;
    D.water=x.water;D.food=x.food;D.weight=x.weight||D.weight;D.set=Object.assign({},D.set,x.set,{key:D.set.key});
    save();loadSet();renderWater();renderFood();renderWeight();$('#bimp').textContent='Готово ✓';
  }catch(e){$('#bimp').textContent='Неверный формат'}
  setTimeout(()=>$('#bimp').textContent='Импорт',1500);
};

loadSet();renderWater();renderFood();renderWeight();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
